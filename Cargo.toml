[package]
name = "nexa-3d-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Renderer-independent validation and debug viewer for the Nexa tutor asset."

[workspace]
members = [".", "crates/nexa-avatar", "crates/nexa-domain", "crates/nexa-events", "crates/nexa-nbp"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.metadata.nexa]
architecture = "docs/Nexa Tutor System — Architecture v0.1.md"
baseline = "docs/BASELINE.md"
specification-registry = "docs/SPECIFICATION-REGISTRY.md"
roadmap = "docs/architecture/IMPLEMENTATION-ROADMAP.md"

[lib]
name = "nexa_3d_runtime"
path = "src/lib.rs"

[[bin]]
name = "nexa-3d-viewer"
path = "src/main.rs"

[[bin]]
name = "nexa-3d-validate"
path = "src/bin/nexa-3d-validate.rs"

[features]
default = ["viewer"]
viewer = ["dep:pollster", "dep:wgpu", "dep:winit"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4", features = ["import", "names", "utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nexa-avatar = { path = "crates/nexa-avatar" }
nexa-domain = { path = "crates/nexa-domain" }
nexa-nbp = { path = "crates/nexa-nbp" }
pollster = { version = "0.4", optional = true }
wgpu = { version = "0.19", optional = true }
winit = { version = "0.29", optional = true }

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
tempfile = "3"
