[workspace]
members = [
    "apps/nexa-3d-viewer",
    "crates/nexa-3d",
    "crates/nexa-avatar",
    "crates/nexa-domain",
    "crates/nexa-events",
    "crates/nexa-lessons",
    "crates/nexa-assessment",
    "crates/nexa-learning-core",
    "crates/nexa-knowledge",
    "crates/nexa-nbp",
    "crates/nexa-orchestrator",
    "crates/nexa-pedagogy",
    "crates/nexa-student",
    "crates/nexa-tutor",
    "tools/nexa-3d-validate",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4", features = ["import", "names", "utils"] }
naga = { version = "0.19", features = ["wgsl-in"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v7"] }
wgpu = "0.19"
winit = "0.29"

[workspace.metadata.nexa]
architecture = "docs/Nexa Tutor System — Architecture v0.1.md"
baseline = "docs/BASELINE.md"
specification-registry = "docs/SPECIFICATION-REGISTRY.md"
roadmap = "docs/architecture/IMPLEMENTATION-ROADMAP.md"
