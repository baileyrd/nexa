[package]
name = "nexa-3d-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Renderer-independent validation and debug viewer for the Nexa tutor asset."

[lib]
name = "nexa_3d_runtime"
path = "src/lib.rs"

[[bin]]
name = "nexa-3d-viewer"
path = "src/main.rs"

[[bin]]
name = "nexa-3d-validate"
path = "src/bin/nexa-3d-validate.rs"

[features]
default = ["viewer"]
viewer = ["dep:pollster", "dep:wgpu", "dep:winit"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
gltf = { version = "1.4", features = ["import", "names", "utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pollster = { version = "0.4", optional = true }
wgpu = { version = "0.19", optional = true }
winit = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"
