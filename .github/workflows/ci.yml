name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Format, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Compile all workspace targets
        run: cargo check --workspace --all-targets
      - name: Compile renderer-free 3D library
        run: cargo check -p nexa-3d --no-default-features
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Enforce dependency boundaries
        run: ./scripts/check-contract-boundaries.sh
      - name: Check whitespace
        run: git diff --check
